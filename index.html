<style>
  :root{
    --ink:#0f172a; --ink-2:#1e293b; --paper:#f1efe9; --card:#ffffff;
    --line:#e2e8f0; --muted:#64748b; --faint:#94a3b8;
    --amber:#d97706; --amber-bg:#fef3c7; --amber-line:#fcd34d;
    --green:#059669; --red:#e11d48; --rose-bg:#ffe4e6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.45;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{
    background:var(--ink); color:#fff; padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
    position:sticky; top:0; z-index:20; box-shadow:0 1px 8px rgba(0,0,0,.15);
  }
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .brand h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
  .brand .tag{font-size:10px;color:var(--faint);font-weight:400;letter-spacing:.02em}
  .drop{font-size:18px}
  .storebar{
    width:100%;background:var(--ink-2);border:0;color:#fff;border-radius:10px;
    padding:11px 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center;
  }
  .menu{background:var(--ink-2);border-radius:10px;margin-top:6px;overflow:hidden}
  .menu button{
    width:100%;background:none;border:0;color:#fff;text-align:left;padding:11px 12px;font-size:15px;
    display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.07)
  }
  .menu button.sel{color:#fbbf24}
  .menu .addrow{display:flex;gap:6px;padding:8px}
  .menu .addrow input{
    flex:1;background:var(--ink);border:1px solid rgba(255,255,255,.12);color:#fff;
    border-radius:7px;padding:8px 10px;font-size:16px
  }
  .menu .addrow button{width:auto;background:#f59e0b;color:var(--ink);font-weight:600;border-radius:7px;padding:8px 14px;border-bottom:0}
  main{padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
  .pad{padding:14px}
  .note{font-size:12px;color:var(--muted);line-height:1.5}
  h2{font-size:14px;margin:0 0 4px;font-weight:650}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input,select,textarea,button{font-family:inherit}
  input,select,textarea{
    font-size:16px; /* keeps iOS from zooming on focus */
    border:1px solid #cbd5e1;border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink);width:100%
  }
  textarea{line-height:1.4}
  .btn{
    border:0;border-radius:9px;padding:11px 14px;font-size:15px;font-weight:600;width:100%;
    background:var(--ink);color:#fff
  }
  .btn.amber{background:#f59e0b;color:var(--ink)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid #cbd5e1;font-weight:500}
  .btn:disabled{opacity:.4}
  .row{display:flex;gap:8px}
  .row>*{flex:1}

  /* dashboard cards */
  .colorcard{display:flex;overflow:hidden}
  .strip{width:7px;flex:0 0 7px}
  .s-green{background:var(--green)} .s-amber{background:#f59e0b}
  .s-red{background:var(--red)} .s-none{background:#cbd5e1}
  .cc-body{flex:1;padding:13px 14px}
  .cc-top{display:flex;justify-content:space-between;align-items:baseline}
  .cc-name{font-size:17px;font-weight:650;letter-spacing:.02em}
  .cc-target{font-size:11px;color:var(--faint)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:10px 0 2px}
  .stats .v{font-size:16px;font-weight:650}
  .stats .k{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
  .meta b{color:var(--ink);font-weight:600}
  .suggest{
    margin-top:10px;background:#f8fafc;border:1px solid var(--line);border-radius:9px;
    padding:9px 12px;display:flex;justify-content:space-between;align-items:center
  }
  .suggest .n{font-size:22px;font-weight:750;color:var(--amber)}
  .suggest .n.ok{color:var(--green)}
  .suggest .none{font-size:12px;color:var(--faint)}
  .last{font-size:11px;color:var(--faint);margin-top:7px}
  .flag{
    margin-top:9px;background:var(--amber-bg);border:1px solid var(--amber-line);color:#78350f;
    border-radius:7px;padding:7px 9px;font-size:11.5px;line-height:1.45
  }

  /* entry rows */
  .erow{border-bottom:1px solid rgba(226,232,240,.7);padding:12px 14px}
  .erow:last-child{border-bottom:0}
  .erow:first-child{border-top-left-radius:12px;border-top-right-radius:12px}
  .erow:last-child{border-bottom-left-radius:12px;border-bottom-right-radius:12px}
  .erow .line{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .erow .nm{font-size:16px;font-weight:600;letter-spacing:.02em}
  .erow .sub{font-size:11px;color:var(--faint);margin-top:1px}
  .erow input{width:92px;text-align:right}
  .rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
  .rowmeta{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.35}
  .rowmeta b{color:var(--ink);font-weight:650}
  .rowmeta .dim{color:var(--faint)}
  label .dim{color:var(--faint);font-weight:400;text-transform:none;letter-spacing:0}
  .warn{color:#b45309;font-weight:600}
  .fields{display:flex;gap:10px;align-items:flex-end}
  .fld{flex:1}
  .fld label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin-bottom:3px}
  .fld input{width:100%;text-align:center}
  .fld .stepper input{width:100%}
  .countfld .bjrow{display:flex;align-items:center;gap:5px}
  .countfld .bjrow input{width:52px;text-align:center;padding:10px 4px}
  .bjx{font-size:12px;color:var(--faint);font-weight:600;white-space:nowrap}
  .bjeq{font-size:12.5px;color:var(--muted);font-weight:650;white-space:nowrap;margin-left:2px;min-width:34px}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:4px}
  .legend span{display:flex;align-items:center;gap:4px}
  .legend .ld{width:8px;height:8px;border-radius:50%;display:inline-block}
  .legend .lb{width:8px;height:8px;border-radius:1px;display:inline-block}
  .dl-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #f1f5f9}
  .dl-row:first-child{border-top:0}
  .dl-row.aside{background:#fff1f2;margin:0 -6px;padding:7px 6px;border-radius:6px;border-top:0}
  .dl-date{font-size:13px;color:var(--muted);width:74px;flex:0 0 74px}
  .dl-qty{font-size:15px;font-weight:650;width:44px;text-align:right}
  .dl-delta{font-size:12.5px;color:var(--faint);flex:1}
  .dl-flag{font-size:11px;color:var(--muted);background:#f1f5f9;border-radius:4px;padding:2px 6px}
  .dl-row.aside .dl-flag{background:#ffe4e6;color:#9f1239}
  .survey-btn{background:#0f766e;color:#fff}
  .survey-btn:active{background:#0d5f58}
  .survey-head{background:#ecfdf5;border-color:#a7f3d0}
  .rowfoot{font-size:11px;color:var(--faint);margin-top:7px;min-height:14px;font-weight:400}
  .rowfoot b{color:var(--muted);font-weight:600}

  .ev{padding:12px 14px;border-bottom:1px solid var(--line)}
  .evactions{display:flex;align-items:center;gap:4px;flex:0 0 auto}
  .editbtn{width:auto;background:#f1f5f9;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600}
  .editbtn:active{background:#e2e8f0}
  .evhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .evtitle{font-size:14.5px;font-weight:650}
  .evsub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:4px 8px;margin-top:9px}
  .cell{display:flex;justify-content:space-between;align-items:baseline;background:#f8fafc;border:1px solid #eef2f7;border-radius:5px;padding:3px 7px}
  .ck{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px}
  .sw{
    display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:1px;
    margin-right:8px;border:1px solid rgba(15,23,42,.14)
  }
  .sw.sm{width:7px;height:7px;margin-right:0;vertical-align:0}
  .swpick{
    width:34px;height:34px;padding:0;border:1px solid #cbd5e1;border-radius:8px;background:none;flex:0 0 34px
  }
  .pig{font-size:10.5px;color:#a8b2c1;margin-top:-1px;letter-spacing:.01em}
  .pigsm{font-size:10.5px;color:var(--faint);margin-left:7px}
  .refrow{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .reflabel{font-size:13px;color:var(--muted)}
  .refval{
    width:auto;background:#f8fafc;border:1px solid var(--line);border-radius:7px;
    padding:6px 12px;font-size:15px;font-weight:650;letter-spacing:.03em;color:var(--ink)
  }
  .refval:active{background:#eef2f7}
  .help{
    width:18px;height:18px;flex:0 0 18px;border-radius:50%;border:1px solid #cbd5e1;background:#fff;
    color:var(--muted);font-size:11px;font-weight:700;line-height:1;padding:0;margin-left:4px;cursor:pointer
  }
  .help:active{background:#f1f5f9}
  .helptext{
    font-size:12.5px;color:var(--muted);line-height:1.55;background:#f8fafc;border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;margin-top:8px
  }
  .helptext p{margin:0 0 8px}
  .helptext p:last-child{margin-bottom:0}
  .helptext b{color:var(--ink)}
  .explainer-toggle{

</style>

<body>

<header>
  <div class="brand">
    <h1><span class="drop">💧</span>Tintuition <span class="tag">know before you pour</span></h1>
  </div>
  <button class="storebar" id="storebar" onclick="toggleMenu()">
    <span id="storelabel">Add a store to begin</span><span>⌄</span>
  </button>
  <div class="menu" id="storemenu" hidden></div>
</header>

<main id="main"></main>

<nav id="nav"></nav>

<script>
"use strict";

/* ---------- constants ---------- */
const COLORANT_SEED = ["AXL","BL","CL","DL","EL","FL","IL","JL","KXL","LL","RL","RUL","TL","VL","VUL","YL"];
const BOX_OF_4 = ["BL","CL","KXL","LL"];   // these ship 4 jars to a box; everything else is 6
const DEFAULT_BOX = 6;
const defaultBox = name => BOX_OF_4.includes(String(name||"").trim().toUpperCase()) ? 4 : DEFAULT_BOX;

/* Pigment identities per the Behr colorant codes, with rough masstone colors.
   These are starting points only — adjust any swatch in Setup to match the real jar. */
const PIGMENTS = {
  AXL:{ n:"Permanent Yellow",  c:"#F5C518" },
  BL: { n:"Black",             c:"#1C1C1C" },
  CL: { n:"Yellow Oxide",      c:"#B07D2B" },
  DL: { n:"Phthalo Green",     c:"#005B4C" },
  EL: { n:"Phthalo Blue",      c:"#14336E" },
  FL: { n:"Red Iron Oxide",    c:"#7B2E20" },
  IL: { n:"Brown Iron Oxide",  c:"#5E3A1E" },
  JL: { n:"Carbazole Purple",  c:"#3E1B57" },
  KXL:{ n:"White",             c:"#F7F6F1" },
  LL: { n:"Raw Umber",         c:"#52402A" },
  RL: { n:"Permanent Red",     c:"#C21B23" },
  RUL:{ n:"Red High-Hide",     c:"#A5121C" },
  TL: { n:"Medium Yellow",     c:"#EF9B00" },
  VL: { n:"Magenta",           c:"#A81B5E" },
  VUL:{ n:"Magenta High-Hide", c:"#87104A" },
  YL: { n:"High-Hide Yellow",  c:"#E8AC08" }
};
const pigmentOf = name => PIGMENTS[String(name||"").trim().toUpperCase()] || null;
const defaultHex = name => (pigmentOf(name) || {}).c || "#94A3B8";
const pigmentName = name => (pigmentOf(name) || {}).n || "";

// A very light wash of a hex colour, for subtle row backgrounds. Mixes the hue
// heavily toward white so even dark pigments (black, phthalo blue) stay readable.
function tintWash(hex){
  const h = String(hex||"").replace("#","");
  if(h.length !== 6) return "transparent";
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  if([r,g,b].some(isNaN)) return "transparent";
  const mix = 0.90;  // 90% white
  const R = Math.round(r + (255-r)*mix);
  const G = Math.round(g + (255-g)*mix);
  const B = Math.round(b + (255-b)*mix);
  return `rgb(${R},${G},${B})`;
}

const VENDOR_ID = "84019";     // same for every store and every rep
const APP_VERSION = "0.6";
const KEY = "tintuition.v1";
const DEFAULT_TARGET_WEEKS = 6;
const DEFAULT_LEAD_DAYS = 6;     // order placed six days before delivery

/* ---------- tiny helpers ---------- */
const uid = () => Math.random().toString(36).slice(2,10);
const today = () => new Date().toISOString().slice(0,10);
const addDays = (d,n) => { const x = new Date(d+"T00:00:00"); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const daysBetween = (a,b) => (new Date(b+"T00:00:00") - new Date(a+"T00:00:00")) / 86400000;
const fmtDate = d => new Date(d+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"2-digit"});
const r1 = n => Math.round(n*10)/10;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byName = a => a.slice().sort((x,y)=>x.name.localeCompare(y.name));

function median(nums){
  if(!nums.length) return null;
  const s = nums.slice().sort((a,b)=>a-b), m = Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}

/* ---------- state ---------- */
let S = null;      // {colorants:[], stores:[{id,number,counts,orders,overrides}], currentId, tab}
let saveWarned = false;

function blankStore(number){
  return { id:uid(), number, counts:[], orders:[], overrides:{}, windowWeeks:6 };
}
function freshState(){
  return {
    colorants: COLORANT_SEED.map(n => ({
      id:uid(), name:n,
      defaultTargetWeeks:DEFAULT_TARGET_WEEKS,
      boxSize: defaultBox(n),
      hex: defaultHex(n)
    })),
    stores: [], currentId:null, tab:"dashboard"
  };
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return freshState();
    const p = JSON.parse(raw);
    if(!p || !Array.isArray(p.colorants) || !Array.isArray(p.stores)) return freshState();
    p.tab = p.tab || "dashboard";
    // guard against older/partial records
    p.stores.forEach(s => { s.counts=s.counts||[]; s.orders=s.orders||[]; s.overrides=s.overrides||{}; if(!s.windowWeeks) s.windowWeeks=6; });
    // older saves predate box sizes — fill them in
    p.colorants.forEach(c => {
      if(!c.boxSize) c.boxSize = defaultBox(c.name);
      if(!c.hex) c.hex = defaultHex(c.name);
    });
    if(!p.colorants.length) p.colorants = freshState().colorants;
    return p;
  }catch(e){ return freshState(); }
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    return true;
  }catch(e){
    if(!saveWarned){
      saveWarned = true;
      alert("This browser isn't letting the app save. If you're in Private Browsing, switch to a normal tab. Use Settings → Download backup so you don't lose anything.");
    }
    return false;
  }
}
const store = () => S.stores.find(s => s.id === S.currentId) || null;
const targetWeeks = (c, st) => {
  const o = st && st.overrides ? st.overrides[c.id] : null;
  return (o === undefined || o === null || o === "") ? (c.defaultTargetWeeks ?? DEFAULT_TARGET_WEEKS) : Number(o);
};

/* ---------- the math ----------
   Usage rate is the MEDIAN of each interval's weekly rate over the last six weeks,
   so one bad count (or its correction the following week) doesn't move the number.
   Position counts jars already ordered but not yet delivered, which is the whole
   point: an order in transit shouldn't read as stock you need to replace.        */
// A delivery isn't countable the moment it arrives — it still has to be shelved, which
// happens the day after at the earliest. So stock becomes "available" the day after its
// arrival date. Everything below keys off availability, not the raw arrival date.
const availDate = o => addDays(o.deliveryDate, 1);

// Count entry can be boxes, loose jars, or both. Total jars = boxes*boxSize + loose.
// Returns null only when both are blank (nothing counted).
function countTotal(boxVal, jarVal, boxSize){
  const hasBox = boxVal !== "" && boxVal != null && !isNaN(Number(boxVal));
  const hasJar = jarVal !== "" && jarVal != null && !isNaN(Number(jarVal));
  if(!hasBox && !hasJar) return null;
  return (hasBox ? Number(boxVal) * (Number(boxSize)||DEFAULT_BOX) : 0) + (hasJar ? Number(jarVal) : 0);
}

function statsFor(colorantId, st, tw){
  const all = st.counts.filter(c => colorantId in c.values).sort((a,b)=> a.date < b.date ? -1 : 1);

  const windowDays = Math.max(2, Number(st.windowWeeks) || 6) * 7;
  const cutoff = addDays(today(), -windowDays);
  let win = all.filter(c => c.date >= cutoff);
  if(win.length < 2) win = all.slice(-2);

  const intervals = [];
  let skipped = 0;                 // weeks where stock rose with no delivery on record
  let lastInt = null;              // the most recent gap between counts
  for(let i=1;i<win.length;i++){
    const p = win[i-1], c = win[i], days = daysBetween(p.date, c.date);
    if(days <= 0) continue;
    const got = st.orders
      .filter(o => colorantId in o.values && availDate(o) > p.date && availDate(o) <= c.date)
      .reduce((s,o)=> s + Number(o.values[colorantId]||0), 0);
    const used = p.values[colorantId] + got - c.values[colorantId];
    lastInt = { used, from:p.date, to:c.date, days, ok: used >= 0 };
    if(used < 0){ skipped++; continue; }   // tells us nothing about usage — set it aside, keep the rest
    intervals.push({ to:c.date, rate:(used/days)*7 });
  }

  // Work with whatever good weeks there are. One odd week shouldn't blank out the others —
  // miscounts and misplaced tint are normal, and a rough number beats no number.
  const rate = median(intervals.map(i => i.rate));
  const usable = rate !== null;
  const thin = usable && intervals.length === 1;   // only one clean week to go on
  const gaps = skipped > 0;                        // worth mentioning, not worth blocking on

  // Spike: a week well over the typical rate. Real trend or a miscount — either way, look.
  let spike = null;
  if(usable && rate > 0 && intervals.length >= 2){
    const worst = intervals.reduce((a,b)=> b.rate > a.rate ? b : a);
    if(worst.rate > rate*2 && worst.rate - rate >= 3) spike = { rate:worst.rate, to:worst.to, typical:rate };
  }

  const last = all.length ? all[all.length-1] : null;
  let onHand = null, pending = 0, position = null;
  if(last){
    onHand = last.values[colorantId];
    // still "coming" if it won't be shelved until after the last count
    pending = st.orders
      .filter(o => colorantId in o.values && availDate(o) > last.date)
      .reduce((s,o)=> s + Number(o.values[colorantId]||0), 0);
    position = onHand + pending;
  }

  const targetLevel = usable ? rate * tw : null;
  const suggested = (targetLevel !== null && position !== null) ? Math.max(0, Math.ceil(targetLevel - position)) : null;
  const weeks = (usable && rate > 0 && position !== null) ? position / rate : null;

  return { rate, usable, thin, gaps, skipped, lastInt, intervals:intervals.length, last, onHand, pending, position, targetLevel, suggested, weeks, spike };
}
function stripClass(weeks, tw){
  if(weeks === null) return "s-none";
  if(weeks < tw*0.5) return "s-red";
  if(weeks < tw) return "s-amber";
  return "s-green";
}

/* Tint ships by the box, so a bare jar count isn't orderable.
   Boxes of 4: always round up — those are the big movers, a few spare jars don't matter.
   Boxes of 6: fill whole boxes, then judge what's left over. A remainder of 1–2 waits
   for next week; 3 or more earns another box. So 7 → 6, 9 → 12, 13 → 12, 15 → 18. */
function boxOrder(raw, box, rate, position, tw){
  if(raw === null) return null;
  const b = Number(box) || DEFAULT_BOX;
  if(raw <= 0) return { qty:0, boxes:0, box:b, raw };

  let boxes;
  if(b <= 4){
    boxes = Math.ceil(raw / b);                 // never leave these short
  } else {
    boxes = Math.floor(raw / b);
    const remainder = raw - boxes * b;
    if(remainder >= 3) boxes += 1;              // worth another box; 1–2 can wait
  }

  const qty = boxes * b;
  if(qty === 0) return { qty:0, boxes:0, box:b, raw, skipped:true };

  // How long would that sit? Matters for slow movers — shelf life and shelf space.
  let coverWeeks = null, overshoot = false;
  if(rate && rate > 0 && position !== null){
    coverWeeks = (position + qty) / rate;
    overshoot = coverWeeks > tw * 2;
  }
  return { qty, boxes, box:b, raw, coverWeeks, overshoot };
}

/* ---------- chrome ---------- */
function toggleMenu(){
  const m = document.getElementById("storemenu");
  if(m.hidden){ renderMenu(); m.hidden = false; } else { m.hidden = true; }
}
function renderMenu(){
  const m = document.getElementById("storemenu");
  m.innerHTML =
    S.stores.map(s => `<button class="${s.id===S.currentId?'sel':''}" onclick="pickStore('${s.id}')">
        <span>Store #${esc(s.number)}</span><span style="font-size:11px;color:#94a3b8">${s.counts.length} counts</span>
      </button>`).join("") +
    `<div class="addrow">
       <input id="newstore" inputmode="numeric" maxlength="4" placeholder="4-digit store #" onkeydown="if(event.key==='Enter')addStore()">
       <button onclick="addStore()">Add</button>
     </div>`;
}
function pickStore(id){ S.currentId = id; save(); document.getElementById("storemenu").hidden = true; render(); }
function addStore(){
  const el = document.getElementById("newstore");
  const num = (el.value||"").replace(/\D/g,"").slice(0,4);
  if(!num) return;
  const existing = S.stores.find(s => s.number === num);
  if(existing){ pickStore(existing.id); return; }
  const s = blankStore(num);
  S.stores.push(s); S.currentId = s.id; save();
  document.getElementById("storemenu").hidden = true;
  render();
}
function setTab(t){ captureEntryDraft(); window.__detail = null; S.tab = t; save(); render(); window.scrollTo(0,0); }

/* ---------- in-progress entry draft ----------
   What you type on the Count & Order screen lives only in the inputs until you Save.
   Any re-render (switching tabs, changing a date) would wipe it. So before every
   re-render we scrape the current inputs into a draft, persist it, and restore it
   when the screen is shown again. Saving clears the draft. */
let entryDraft = null;
function captureEntryDraft(){
  const cd = document.getElementById("countdate");
  if(!cd || !S) return;                       // not currently on the entry screen
  const st = store(); if(!st) return;
  const d = { storeId:st.id, date:cd.value, cbox:{}, cjar:{}, ord:{}, touched:{} };
  const dv = document.getElementById("deliver"); if(dv) d.deliver = dv.value;
  const po = document.getElementById("ponum"); if(po) d.po = po.value;
  for(const c of S.colorants){
    const bxi = document.getElementById("cbox_"+c.id);
    const jri = document.getElementById("cjar_"+c.id);
    if(bxi && bxi.value !== "") d.cbox[c.id] = bxi.value;
    if(jri && jri.value !== "") d.cjar[c.id] = jri.value;
    const oi = document.getElementById("ord_"+c.id);
    if(oi){
      if(oi.value !== "") d.ord[c.id] = oi.value;
      if(oi.dataset.touched) d.touched[c.id] = 1;
    }
  }
  const empty = Object.keys(d.cbox).length === 0 && Object.keys(d.cjar).length === 0
             && Object.keys(d.touched).length === 0 && !d.po;
  entryDraft = empty ? null : d;
  try{
    if(entryDraft) localStorage.setItem(KEY+".draft", JSON.stringify(entryDraft));
    else localStorage.removeItem(KEY+".draft");
  }catch(e){}
}
function loadEntryDraft(){
  try{
    const raw = localStorage.getItem(KEY+".draft");
    entryDraft = raw ? JSON.parse(raw) : null;
  }catch(e){ entryDraft = null; }
}
function clearEntryDraft(){
  entryDraft = null;
  try{ localStorage.removeItem(KEY+".draft"); }catch(e){}
}
function currentDraft(st){
  return (entryDraft && entryDraft.storeId === st.id) ? entryDraft : null;
}

/* ---------- views ---------- */
function viewDashboard(st){
  const cs = S.colorants;
  if(!cs.length) return `<div class="empty">No colorants yet. Add them in Settings.</div>`;
  let out = `<div class="card pad note">
    Suggested order = (target weeks × weekly usage) − what you already have coming, rounded to whole boxes.
    Usage is the median of the last six weeks of counts, so one bad count won't swing it.
  </div>`;
  for(const c of cs){
    const tw = targetWeeks(c, st), s = statsFor(c.id, st, tw);
    const bx = boxOrder(s.suggested, c.boxSize, s.rate, s.position, tw);
    out += `<div class="card colorcard" onclick="openDetail('${c.id}')" style="cursor:pointer">
      <div class="strip ${stripClass(s.weeks, tw)}"></div>
      <div class="cc-body">
        <div class="cc-top">
          <span class="cc-name mono"><span class="sw" style="background:${esc(c.hex||defaultHex(c.name))}"></span>${esc(c.name)}</span>
          <span class="cc-target">target ${tw} wk · box of ${c.boxSize || DEFAULT_BOX}</span>
        </div>
        ${pigmentName(c.name) ? `<div class="pig">${esc(pigmentName(c.name))}</div>` : ""}
        <div class="stats">
          <div><div class="v mono">${s.onHand ?? "—"}</div><div class="k">On hand</div></div>
          <div><div class="v mono">${s.last ? s.pending : "—"}</div><div class="k">Coming</div></div>
          <div><div class="v mono">${s.position !== null ? r1(s.position) : "—"}</div><div class="k">Total</div></div>
        </div>
        <div class="meta">
          <span>Usage <b>${s.usable ? r1(s.rate)+"/wk" : "needs 2+ counts"}</b>${s.thin ? ` <span class="dim">(1 wk)</span>` : ""}</span>
          <span>Target level <b>${s.targetLevel !== null ? r1(s.targetLevel) : "—"}</b></span>
        </div>
        <div class="suggest">
          <span class="note">Order now${bx && bx.qty > 0 ? ` · ${bx.boxes} box${bx.boxes>1?"es":""} of ${bx.box}` : ""}</span>
          ${bx
            ? `<span class="n ${bx.qty>0?"":"ok"}">${bx.qty}</span>`
            : `<span class="none">needs 2+ counts</span>`}
        </div>
        ${bx && bx.skipped ? `<div class="last">Short by ${r1(bx.raw)} — under a box, so it can wait a cycle.</div>` : ""}
        ${bx && bx.qty > 0 && bx.qty - bx.raw >= 1 ? `<div class="last">Need ${r1(bx.raw)}, boxes come in ${bx.box}.</div>` : ""}
        ${s.last ? `<div class="last">Last counted ${fmtDate(s.last.date)}</div>` : ""}
        ${bx && bx.overshoot ? `<div class="flag">That box puts you at about ${Math.round(bx.coverWeeks)} weeks' supply — a while on the shelf for a slow mover. Fine if it keeps, worth skipping if space is tight.</div>` : ""}
        ${s.gaps ? `<div class="last">${s.skipped} week${s.skipped>1?"s":""} set aside — stock rose with no delivery logged${s.usable ? ", so usage comes from the other weeks" : ""}. Check that deliveries are logged with the date they arrived.</div>` : ""}
        ${s.spike ? `<div class="flag">Spike — about ${r1(s.spike.rate)}/wk in the week ending ${fmtDate(s.spike.to)}, against ${r1(s.spike.typical)}/wk typical. Could be a real run or a miscount.</div>` : ""}
      </div>
    </div>`;
  }
  return out;
}

/* ---------- combined count + order ---------- */
/* Counting and ordering happen in the same trip round the shelf, so they share a screen.
   Typing a count immediately re-runs the math for that colorant, so the suggested order
   reflects what you just counted rather than last week's number. */
function viewEntry(st){
  const dr = currentDraft(st);
  const cd = window.__countDate || (dr && dr.date) || today();
  const placed = window.__placed || today();
  const deliver = window.__deliver || (dr && dr.deliver) || addDays(placed, DEFAULT_LEAD_DAYS);

  let rows = "";
  for(const c of S.colorants){
    const tw = targetWeeks(c, st), s = statsFor(c.id, st, tw);
    const b = c.boxSize || DEFAULT_BOX;
    const bx = boxOrder(s.suggested, b, s.rate, s.position, tw);
    const cboxVal = dr && dr.cbox && (c.id in dr.cbox) ? dr.cbox[c.id] : "";
    const cjarVal = dr && dr.cjar && (c.id in dr.cjar) ? dr.cjar[c.id] : "";
    const cntTotal = countTotal(cboxVal, cjarVal, b);
    const touched = dr && dr.touched && dr.touched[c.id];
    const ordVal = dr
      ? (c.id in dr.ord ? dr.ord[c.id] : "")
      : (bx && bx.qty > 0 ? bx.qty : "");
    rows += `<div class="erow" id="row_${c.id}" style="background:${tintWash(c.hex||defaultHex(c.name))}">
      <div class="rowhead">
        <span class="nm mono"><span class="sw" style="background:${esc(c.hex||defaultHex(c.name))}"></span>${esc(c.name)}</span>
        <span class="rowmeta" id="meta_${c.id}">${entryMeta(s, tw)}</span>
      </div>
      <div class="fields">
        <div class="fld countfld">
          <label>Count</label>
          <div class="bjrow">
            <input type="number" inputmode="numeric" id="cbox_${c.id}" placeholder="box" value="${cboxVal}"
                   data-cid="${c.id}" data-box="${b}" oninput="countChanged('${c.id}')" aria-label="Boxes of ${esc(c.name)}">
            <span class="bjx">×${b}+</span>
            <input type="number" inputmode="numeric" id="cjar_${c.id}" placeholder="jar" value="${cjarVal}"
                   data-cid="${c.id}" oninput="countChanged('${c.id}')" aria-label="Loose jars of ${esc(c.name)}">
            <span class="bjeq" id="eq_${c.id}">${cntTotal !== null ? "= "+cntTotal : ""}</span>
          </div>
        </div>
        <div class="fld">
          <label for="ord_${c.id}">Order · box of ${b}</label>
          <div class="stepper">
            <button type="button" class="step" onclick="bump('${c.id}',${b},-1)" aria-label="One box fewer of ${esc(c.name)}">−</button>
            <input type="number" inputmode="numeric" id="ord_${c.id}" placeholder="0" value="${ordVal}"
                   step="${b}" min="0" data-box="${b}"${touched ? ' data-touched="1"' : ''} onblur="snapBox('${c.id}')" oninput="orderTouched('${c.id}')">
            <button type="button" class="step" onclick="bump('${c.id}',${b},1)" aria-label="One box more of ${esc(c.name)}">+</button>
          </div>
        </div>
      </div>
      <div class="rowfoot" id="foot_${c.id}">${entryFoot(s, bx)}</div>
    </div>`;
  }

  return `<div class="card pad">
      <div class="row">
        <div><label for="countdate">Counted</label>
          <input type="date" id="countdate" value="${cd}" onchange="captureEntryDraft();window.__countDate=this.value;render()"></div>
        <div><label for="deliver">Order arrives</label>
          <input type="date" id="deliver" value="${deliver}" onchange="captureEntryDraft();window.__deliver=this.value;render()"></div>
      </div>
      <div class="note" style="margin-top:8px">
        Fill in either column or both. Order amounts start at the suggestion and update as you enter counts.
      </div>
    </div>
    <div class="card">${rows}</div>
    <div class="card pad">
      <label for="ponum">PO number <span class="dim">(optional)</span></label>
      <input type="text" id="ponum" inputmode="text" autocomplete="off" placeholder="from the ordering system"
             value="${esc((currentDraft(st) && currentDraft(st).po) || window.__po || "")}" oninput="window.__po=this.value;captureEntryDraft()">
      <div class="note" style="margin-top:6px">Saved with the order, handy if a shipment needs tracking down.</div>
      <div class="refrow" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
        <span class="reflabel">Vendor ID</span>
        <button class="refval mono" onclick="copyText('${VENDOR_ID}', this)" title="Copy">${VENDOR_ID}</button>
      </div>
    </div>
    <button class="btn" onclick="saveEntry()">Save</button>
    <div style="height:10px"></div>
    <button class="btn ghost" onclick="clearOrders()">Clear all order amounts</button>
    <div style="height:18px"></div>
    <button class="btn survey-btn" onclick="openSurvey()">🗓 Colorant Survey (quarterly)</button>`;
}

function entryMeta(s, tw){
  if(!s.last) return `<span class="dim">no counts yet</span>`;
  const bits = [`on hand <b>${s.onHand}</b>`];
  if(s.pending) bits.push(`coming <b>${s.pending}</b>`);
  bits.push(s.usable ? `uses <b>${r1(s.rate)}/wk</b>${s.thin ? ` <span class="dim">(1 wk)</span>` : ""}` : `<span class="dim">needs 2+ counts</span>`);
  return bits.join(" · ");
}
function entryFoot(s, bx){
  const out = [];
  if(s.last) out.push(`last counted ${fmtDate(s.last.date)}`);
  if(bx && bx.qty > 0) out.push(`${bx.boxes} box${bx.boxes>1?"es":""}`);
  else if(bx && bx.skipped) out.push(`short ${r1(bx.raw)} — under a box, can wait`);
  if(bx && bx.overshoot) out.push(`~${Math.round(bx.coverWeeks)} wk supply`);
  if(s.gaps) out.push(`${s.skipped} wk set aside — check delivery dates`);
  return out.join(" · ");
}

/* recompute one row against the count just typed (boxes + loose jars) */
function countChanged(cid){
  const st = store(); if(!st) return;
  const c = S.colorants.find(x => x.id === cid); if(!c) return;
  const b = c.boxSize || DEFAULT_BOX;
  const boxEl = document.getElementById("cbox_"+cid);
  const jarEl = document.getElementById("cjar_"+cid);
  const total = countTotal(boxEl ? boxEl.value : "", jarEl ? jarEl.value : "", b);
  const cd = (document.getElementById("countdate")||{}).value || today();

  // live "= N" readout
  const eq = document.getElementById("eq_"+cid);
  if(eq) eq.textContent = total !== null ? "= "+total : "";

  const provisional = total === null ? st
    : { counts:[...st.counts.filter(k => k.date !== cd || !(cid in k.values)), { id:"tmp", date:cd, values:{ [cid]:total } }],
        orders: st.orders, overrides: st.overrides, windowWeeks: st.windowWeeks };

  const tw = targetWeeks(c, st);
  const s = statsFor(cid, provisional, tw);
  const bx = boxOrder(s.suggested, b, s.rate, s.position, tw);

  const meta = document.getElementById("meta_"+cid);
  const foot = document.getElementById("foot_"+cid);
  if(meta) meta.innerHTML = entryMeta(s, tw);
  if(foot) foot.innerHTML = entryFoot(s, bx);

  // update the suggested order unless the user has typed their own amount
  const ord = document.getElementById("ord_"+cid);
  if(ord && !ord.dataset.touched){
    ord.value = bx && bx.qty > 0 ? bx.qty : "";
  }
  captureEntryDraft();
}
function orderTouched(cid){
  const el = document.getElementById("ord_"+cid);
  if(el) el.dataset.touched = "1";
  captureEntryDraft();
}
function clearOrders(){
  for(const c of S.colorants){
    const el = document.getElementById("ord_"+c.id);
    if(el){ el.value = ""; el.dataset.touched = "1"; }
  }
  captureEntryDraft();
}

function saveEntry(){
  const st = store(); if(!st) return;
  const cd = document.getElementById("countdate").value || today();
  const deliver = document.getElementById("deliver").value || addDays(today(), DEFAULT_LEAD_DAYS);

  const counts = {}, orders = {};
  for(const c of S.colorants){
    const box = c.boxSize || DEFAULT_BOX;
    const bxi = document.getElementById("cbox_"+c.id);
    const jri = document.getElementById("cjar_"+c.id);
    const total = countTotal(bxi ? bxi.value : "", jri ? jri.value : "", box);
    if(total !== null) counts[c.id] = total;

    const ov = Number(document.getElementById("ord_"+c.id).value);
    if(ov && ov > 0) orders[c.id] = Math.max(1, Math.round(ov / box)) * box;
  }

  const nC = Object.keys(counts).length, nO = Object.keys(orders).length;
  if(!nC && !nO){ alert("Nothing entered yet."); return; }

  const parts = [];
  if(nC) parts.push(`${nC} count${nC>1?"s":""} dated ${fmtDate(cd)}`);
  const poNow = ((document.getElementById("ponum")||{}).value || "").trim();
  if(nO) parts.push(`an order of ${Object.values(orders).reduce((a,b)=>a+b,0)} jars arriving ${fmtDate(deliver)}${poNow ? ` (PO ${poNow})` : ""}`);
  if(!confirm("Save " + parts.join(" and ") + "?")) return;

  const po = ((document.getElementById("ponum")||{}).value || "").trim();

  if(nC) st.counts.push({ id:uid(), date:cd, values:counts });
  if(nO) st.orders.push({ id:uid(), placedDate: cd || today(), deliveryDate:deliver, values:orders, po: po || undefined });

  save();
  clearEntryDraft();
  window.__countDate = null; window.__placed = null; window.__deliver = null; window.__po = null;
  S.tab = "dashboard"; render(); window.scrollTo(0,0);
}

function bump(id, box, dir){
  const el = document.getElementById("ord_"+id);
  if(!el) return;
  const cur = Number(el.value) || 0;
  const boxes = Math.max(0, Math.round(cur / box) + dir);
  el.value = boxes ? boxes * box : "";
  el.dataset.touched = "1";
  captureEntryDraft();
}
function snapBox(id){
  const el = document.getElementById("ord_"+id);
  if(!el) return;
  const box = Number(el.dataset.box) || DEFAULT_BOX;
  const v = Number(el.value);
  if(el.value === "" || isNaN(v) || v <= 0){ el.value = ""; }
  else el.value = Math.max(1, Math.round(v / box)) * box;   // nearest whole box
  captureEntryDraft();
}

function openDetail(cid){ window.__detail = cid; render(); window.scrollTo(0,0); }
function closeDetail(){ window.__detail = null; render(); }

// Per-colorant analysis for the detail view: every count with its delta, every delivery,
// and which weeks were set aside (stock rose with no delivery on record).
function detailData(cid, st){
  const counts = st.counts.filter(c => cid in c.values).sort((a,b)=> a.date < b.date ? -1 : 1);
  const rows = counts.map((c,i) => {
    let delta = null, setAside = false;
    if(i > 0){
      const p = counts[i-1];
      const got = st.orders
        .filter(o => cid in o.values && availDate(o) > p.date && availDate(o) <= c.date)
        .reduce((s,o)=> s + Number(o.values[cid]||0), 0);
      const used = p.values[cid] + got - c.values[cid];
      delta = c.values[cid] - p.values[cid];   // raw change in on-hand
      setAside = used < 0;                       // rose beyond what deliveries explain
    }
    return { date:c.date, qty:c.values[cid], delta, setAside };
  });
  const dels = st.orders.filter(o => cid in o.values)
    .map(o => ({ date:o.deliveryDate, qty:o.values[cid], po:o.po, arrived: addDays(o.deliveryDate,1) <= today() }))
    .sort((a,b)=> a.date < b.date ? 1 : -1);
  return { counts:rows, dels };
}

  // timeline strip: counts (dark dots) and deliveries (amber dots) along a date axis
  const events = [

  if(events.length){
    const times = events.map(e => new Date(e.date+"T00:00:00").getTime());
    const min = Math.min(...times), max = Math.max(...times), span = (max-min)||1;

    }).join("");
    strip = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px">
        <line x1="${PAD}" y1="18" x2="${W-PAD}" y2="18" stroke="#e2e8f0"/>
        ${dots}
        <text x="${PAD}" y="45" font-size="8" fill="#94a3b8">${fmtDate(events.reduce((a,b)=>a.date<b.date?a:b).date)}</text>
        <text x="${W-PAD}" y="45" text-anchor="end" font-size="8" fill="#94a3b8">${fmtDate(events.reduce((a,b)=>a.date>b.date?a:b).date)}</text>
      </svg>
      <div class="legend">
        <span><span class="ld" style="background:#0f172a"></span>count</span>
        <span><span class="ld" style="background:#e11d48"></span>set-aside week</span>
        <span><span class="lb" style="background:#d97706"></span>delivery</span>
      </div>`;
  }

  const countList = d.counts.length ? d.counts.slice().reverse().map(x =>
    `<div class="dl-row${x.setAside ? " aside" : ""}">
      <span class="dl-date">${fmtDate(x.date)}</span>

  const delList = d.dels.length ? d.dels.map(x =>
    `<div class="dl-row">
      <span class="dl-date">${fmtDate(x.date)}</span>
      <span class="dl-qty mono">${x.qty}</span>
      <span class="dl-delta">${x.arrived ? "arrived" : `<span class="warn">in transit</span>`}</span>
      ${x.po ? `<span class="dl-flag">PO ${esc(x.po)}</span>` : ""}
    </div>`).join("") : `<div class="note">No deliveries logged.</div>`;

  return `
    <div class="card pad">
      <button class="btn ghost" style="width:auto;padding:6px 12px" onclick="closeDetail()">‹ Back</button>
      <div style="display:flex;align-items:center;gap:9px;margin-top:12px">
        <span class="sw" style="width:16px;height:16px;background:${esc(c.hex||defaultHex(c.name))}"></span>
        <span class="mono" style="font-size:20px;font-weight:700">${esc(c.name)}</span>
        ${pigmentName(c.name) ? `<span class="pig" style="margin:0">${esc(pigmentName(c.name))}</span>` : ""}
      </div>
      <div class="stats" style="margin-top:12px">
        <div><div class="v mono">${s.onHand ?? "—"}</div><div class="k">On hand</div></div>
        <div><div class="v mono">${s.last ? s.pending : "—"}</div><div class="k">Coming</div></div>
        <div><div class="v mono">${s.usable ? r1(s.rate) : "—"}</div><div class="k">Jars/wk</div></div>
        <div><div class="v mono">${bx ? bx.qty : "—"}</div><div class="k">Order</div></div>
      </div>

    <div class="card pad">

/* ---------- Colorant Survey (quarterly count & date) ----------
   A separate mode: count every jar, and separately count jars older than a cutoff
   batch code. Codes are YYL — two-digit year + a month letter, skipping I (A=Jan…
   H=Aug… but with I skipped, so the 9th letter is J=Sep, etc). Two cutoffs: one for
   the box-of-4 colorants, one for the rest. Totals only; exported as a text record. */
const MONTH_LETTERS = "ABCDEFGHJKLM";   // 12 letters, I omitted
function parseBatch(code){
  const m = String(code||"").trim().toUpperCase().match(/^(\d{2})([A-M])$/);
  if(!m) return null;
  const letter = m[2];
  const idx = MONTH_LETTERS.indexOf(letter);
  if(idx < 0) return null;              // rejects I and anything past M
  return { year: 2000 + Number(m[1]), month: idx + 1, code: m[1]+letter };
}
function batchLabel(code){
  const p = parseBatch(code);
  if(!p) return null;
  const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${names[p.month-1]} 20${String(p.year).slice(2)}`;
}
function isFourBox(c){ return (c.boxSize || DEFAULT_BOX) === 4; }

function openSurvey(){ window.__survey = window.__survey || { cut4:"", cut6:"", tot:{}, aged:{} }; S.tab = "survey"; save(); render(); window.scrollTo(0,0); }
function closeSurvey(){ S.tab = "entry"; render(); window.scrollTo(0,0); }

function surveySet(kind, cid, val){
  const sv = window.__survey; if(!sv) return;
  if(kind === "cut4") sv.cut4 = val;
  else if(kind === "cut6") sv.cut6 = val;
  else if(kind === "tot") sv.tot[cid] = val;
  else if(kind === "aged") sv.aged[cid] = val;
  surveyRefresh();
}
function surveyRefresh(){
  const sv = window.__survey; if(!sv) return;
  let totJars = 0, agedJars = 0, bad = false;
  for(const c of S.colorants){
    const t = Number(sv.tot[c.id]||0), a = Number(sv.aged[c.id]||0);
    totJars += t; agedJars += a;
    if(a > t) bad = true;
  }
  const el = document.getElementById("survey-totals");
  if(el) el.innerHTML = `<b>${totJars}</b> jars total · <b>${agedJars}</b> aged${bad ? ` · <span class="warn">a row has more aged than total</span>` : ""}`;
  // update per-row cutoff labels live
  for(const c of S.colorants){
    const lab = document.getElementById("scut_"+c.id);
    if(lab){
      const code = isFourBox(c) ? sv.cut4 : sv.cut6;
      const l = batchLabel(code);
      lab.textContent = l ? `older than ${parseBatch(code).code} (${l})` : "older than —";
    }
  }
}

function viewSurvey(st){
  const sv = window.__survey;
  const rows = S.colorants.map(c => {
    const code = isFourBox(c) ? sv.cut4 : sv.cut6;
    const l = batchLabel(code);
    const cutTxt = l ? `older than ${parseBatch(code).code} (${l})` : "older than —";
    return `<div class="erow" style="background:${tintWash(c.hex||defaultHex(c.name))}">
      <div class="rowhead">
        <span class="nm mono"><span class="sw" style="background:${esc(c.hex||defaultHex(c.name))}"></span>${esc(c.name)}</span>

      </div>
      <div class="fields">
        <div class="fld">

        </div>
        <div class="fld">
          <label for="saged_${c.id}"><span id="scut_${c.id}">${cutTxt}</span></label>

        </div>

  }).join("");

  return `
    <div class="card pad survey-head">
      <button class="btn ghost" style="width:auto;padding:6px 12px" onclick="closeSurvey()">‹ Back</button>
      <h2 style="margin-top:12px">Colorant Survey</h2>
      <div class="note">Quarterly count and date. Enter total jars and how many are older than each cutoff code. Codes are like <b>26H</b> (year + month letter, no I).</div>
      <div class="row" style="margin-top:12px">
        <div><label for="cut4">Boxes-of-4 cutoff</label>
          <input type="text" id="cut4" autocomplete="off" placeholder="e.g. 25M" value="${esc(sv.cut4||"")}" oninput="surveySet('cut4',null,this.value)"></div>
        <div><label for="cut6">Boxes-of-6 cutoff</label>
          <input type="text" id="cut6" autocomplete="off" placeholder="e.g. 25H" value="${esc(sv.cut6||"")}" oninput="surveySet('cut6',null,this.value)"></div>
      </div>
      <div class="note" style="margin-top:6px" id="cutwarn"></div>
    </div>

    <div class="card">${rows}</div>

    <div class="card pad">
      <div id="survey-totals" class="note" style="font-size:14px">—</div>
      <button class="btn" style="margin-top:12px" onclick="exportSurvey()">Export as text file</button>
      <div style="height:8px"></div>
      <button class="btn ghost" onclick="clearSurvey()">Clear survey</button>
    </div>`;
}

function clearSurvey(){
  if(!confirm("Clear all survey entries?")) return;
  window.__survey = { cut4:"", cut6:"", tot:{}, aged:{} };
  render();
}

function exportSurvey(){
  const sv = window.__survey; if(!sv) return;
  const st = store();
  const c4 = parseBatch(sv.cut4), c6 = parseBatch(sv.cut6);
  const L = [];
  L.push("COLORANT SURVEY");
  L.push("Store #" + (st ? st.number : "?"));
  L.push("Date: " + today());
  L.push("Boxes-of-4 cutoff: " + (c4 ? c4.code + " ("+batchLabel(sv.cut4)+")" : "(not set)"));
  L.push("Boxes-of-6 cutoff: " + (c6 ? c6.code + " ("+batchLabel(sv.cut6)+")" : "(not set)"));
  L.push("");
  L.push("Colorant   Total   Aged   Cutoff");
  L.push("--------------------------------------");
  let tT=0, tA=0;
  for(const c of S.colorants){
    const t = Number(sv.tot[c.id]||0), a = Number(sv.aged[c.id]||0);
    tT += t; tA += a;
    const code = isFourBox(c) ? (c4?c4.code:"—") : (c6?c6.code:"—");
    L.push(
      c.name.padEnd(10) + " " +
      String(t).padStart(5) + "  " +
      String(a).padStart(5) + "   " + code
    );
  }
  L.push("--------------------------------------");
  L.push("TOTAL".padEnd(10) + " " + String(tT).padStart(5) + "  " + String(tA).padStart(5));
  const text = L.join("\n");

  const blob = new Blob([text], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `colorant-survey-${st?st.number:"store"}-${today()}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function viewHistory(st){
  if(window.__editEvent){
    const found = findEvent(st, window.__editEvent);
    if(found) return viewEditEvent(st, found.type, found.ev);
    window.__editEvent = null;
  }
  const sel = window.__chartId || (S.colorants[0] && S.colorants[0].id);
  const c = S.colorants.find(x => x.id === sel);
  const pts = c ? st.counts.filter(x => sel in x.values).sort((a,b)=> a.date<b.date?-1:1) : [];

  let chart = "";
  if(c && pts.length >= 2){
    const tw = targetWeeks(c, st), s = statsFor(c.id, st, tw);
    const W = 320, H = 160, PL = 30, PR = 8, PT = 10, PB = 22;
    const xs = pts.map(p => new Date(p.date+"T00:00:00").getTime());
    const ys = pts.map(p => p.values[sel]);
    const maxY = Math.max(...ys, s.targetLevel || 0) * 1.15 || 10;
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const px = t => PL + ((t - x0) / ((x1 - x0) || 1)) * (W - PL - PR);
    const py = v => PT + (1 - v/maxY) * (H - PT - PB);
    const line = pts.map((p,i)=> `${i?"L":"M"}${px(xs[i]).toFixed(1)},${py(ys[i]).toFixed(1)}`).join(" ");
    const dots = pts.map((p,i)=> `<circle cx="${px(xs[i]).toFixed(1)}" cy="${py(ys[i]).toFixed(1)}" r="3" fill="#0f172a"/>`).join("");
    const grid = [0,.5,1].map(f => {
      const v = maxY*f, y = py(v).toFixed(1);
      return `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#e2e8f0"/>
              <text x="${PL-5}" y="${Number(y)+3}" text-anchor="end" font-size="8" fill="#94a3b8">${Math.round(v)}</text>`;
    }).join("");
    const tgt = s.targetLevel ? `<line x1="${PL}" y1="${py(s.targetLevel).toFixed(1)}" x2="${W-PR}" y2="${py(s.targetLevel).toFixed(1)}"
        stroke="#d97706" stroke-dasharray="4 3"/>
        <text x="${W-PR}" y="${py(s.targetLevel)-4}" text-anchor="end" font-size="8" fill="#d97706">target</text>` : "";
    chart = `<div class="card pad"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
        aria-label="On-hand jars over time for ${esc(c.name)}">
        ${grid}${tgt}<path d="${line}" fill="none" stroke="#0f172a" stroke-width="2"/>${dots}
        <text x="${PL}" y="${H-6}" font-size="8" fill="#94a3b8">${fmtDate(pts[0].date)}</text>
        <text x="${W-PR}" y="${H-6}" text-anchor="end" font-size="8" fill="#94a3b8">${fmtDate(pts[pts.length-1].date)}</text>
      </svg></div>`;
  }

  const events = [
    ...st.counts.map(c => ({t:"count", d:c.date, id:c.id, v:c.values})),
    ...st.orders.map(o => ({t:"order", d:o.placedDate, dd:o.deliveryDate, id:o.id, v:o.values, po:o.po}))
  ].sort((a,b)=> a.d < b.d ? 1 : -1);

  const list = events.length ? events.map(e => {
    const entries = Object.entries(e.v)
      .map(([id,v]) => {
        const cc = S.colorants.find(x=>x.id===id) || { name:"?" };
        return { name:cc.name, hex:cc.hex || defaultHex(cc.name), v };
      })
      .sort((a,b)=> a.name.localeCompare(b.name));
    const total = entries.reduce((a,x)=> a + Number(x.v||0), 0);
    const arrived = e.t === "order" ? addDays(e.dd, 1) <= today() : null;

    const cells = entries.map(x =>
      `<div class="cell"><span class="mono ck"><span class="sw sm" style="background:${esc(x.hex)}"></span>${esc(x.name)}</span><span class="cv">${x.v}</span></div>`
    ).join("");

    return `<div class="ev">
      <div class="evhead">
        <div>
          <div class="evtitle">
            ${e.t === "count" ? "Counted" : "Ordered"} ${fmtDate(e.d)}
          </div>
          <div class="evsub">
            ${e.t === "count"
              ? `${entries.length} colorant${entries.length>1?"s":""} · ${total} jars on hand`
              : `${total} jars · ${arrived ? `arrived ${fmtDate(e.dd)}` : `<span class="warn">in transit — arrives ${fmtDate(e.dd)}</span>`}${e.po ? ` · PO ${esc(e.po)}` : ""}`}
          </div>
        </div>
        <div class="evactions">
          <button class="editbtn" onclick="openEdit('${e.id}')" aria-label="Edit this entry">Edit</button>
          <button class="del" onclick="removeEvent('${e.t}','${e.id}')" aria-label="Delete this entry">×</button>
        </div>
      </div>
      <div class="grid">${cells}</div>
    </div>`;
  }).join("") : `<div class="empty">Nothing logged for this store yet.</div>`;

  return `<div class="card pad">
      <label for="chartsel">Chart</label>
      <select id="chartsel" onchange="window.__chartId=this.value;render()">
        ${S.colorants.map(x=>`<option value="${x.id}" ${x.id===sel?"selected":""}>${esc(x.name)}</option>`).join("")}
      </select>
    </div>${chart}<div class="card">${list}</div>`;
}
function findEvent(st, id){
  const c = st.counts.find(x => x.id === id);
  if(c) return { type:"count", ev:c };
  const o = st.orders.find(x => x.id === id);
  if(o) return { type:"order", ev:o };
  return null;
}
function openEdit(id){ window.__editEvent = id; render(); window.scrollTo(0,0); }
function cancelEdit(){ window.__editEvent = null; render(); }

function viewEditEvent(st, type, ev){

function snapEdit(id){
  const el = document.getElementById("ed_"+id);
  if(!el) return;
  const box = Number(el.dataset.box) || DEFAULT_BOX;
  const v = Number(el.value);
  if(el.value === "" || isNaN(v) || v <= 0){ el.value = ""; return; }
  el.value = Math.max(1, Math.round(v / box)) * box;
}
function saveEdit(type, id){
  const st = store(); if(!st) return;
  const found = findEvent(st, id); if(!found) { cancelEdit(); return; }
  const ev = found.ev;
  const isCount = type === "count";

  const values = {};
  for(const c of S.colorants){
    const raw = document.getElementById("ed_"+c.id).value;
    if(raw === "" || Number(raw) < 0) continue;
    if(isCount){
      values[c.id] = Number(raw);
    } else {
      const box = c.boxSize || DEFAULT_BOX;
      const q = Number(raw);
      if(q > 0) values[c.id] = Math.max(1, Math.round(q / box)) * box;
    }
  }
  if(!Object.keys(values).length){ alert("An entry needs at least one colorant. Delete it instead if that's what you want."); return; }

  if(isCount){
    ev.date = document.getElementById("ed_date").value || ev.date;
  } else {
    ev.placedDate = document.getElementById("ed_placed").value || ev.placedDate;
    ev.deliveryDate = document.getElementById("ed_deliver").value || ev.deliveryDate;
    if(ev.deliveryDate < ev.placedDate){ alert("The arrival date is before the order date."); return; }
    const po = (document.getElementById("ed_po").value || "").trim();
    if(po) ev.po = po; else delete ev.po;
  }
  ev.values = values;

  save();
  window.__editEvent = null;
  render(); window.scrollTo(0,0);
}

function removeEvent(type, id){
  const st = store(); if(!st) return;
  if(!confirm("Delete this entry?")) return;
  if(type === "count") st.counts = st.counts.filter(c => c.id !== id);
  else st.orders = st.orders.filter(o => o.id !== id);
  save(); render();
}

function copyText(txt, btn){
  const done = () => {
    if(!btn) return;
    const was = btn.textContent;
    btn.textContent = "copied";

/* ---------- backup ---------- */
/* Accepts two shapes:
   - this app's own:   { tintuition:1, data:{ colorants, stores:[{...counts,orders,overrides}] } }
   - the earlier one:  { tintuition:1, colorants, stores:[{id,number}], storeData:{ id:{counts,orders,overrides} } }
*/
function normalizeBackup(parsed){
  if(!parsed) return null;
  const d = parsed.data ? parsed.data : parsed;
  if(!Array.isArray(d.colorants) || !Array.isArray(d.stores)) return null;

  // older shape kept counts in a separate storeData map, keyed by store id
  const sd = d.storeData || parsed.storeData;
  const stores = d.stores.map(s => {
    const extra = sd && sd[s.id] ? sd[s.id] : s;
    return {
      id: s.id || uid(),
      number: String(s.number || s.name || "").replace(/\D/g,"").slice(0,4) || "0000",
      counts: extra.counts || [],
      orders: extra.orders || [],
      overrides: extra.overrides || {},
      windowWeeks: Number(extra.windowWeeks) || 6
    };
  });

  return {
    colorants: byName(d.colorants.map(c => ({
      id: c.id || uid(),
      name: String(c.name || "").toUpperCase(),
      defaultTargetWeeks: Number(c.defaultTargetWeeks ?? c.targetWeeks ?? DEFAULT_TARGET_WEEKS),
      boxSize: Number(c.boxSize) || defaultBox(c.name),
      hex: c.hex || defaultHex(c.name)
    }))),
    stores,
    currentId: stores.length ? stores[0].id : null,
    tab: "dashboard"
  };
}

function applyBackup(parsed){
  const d = normalizeBackup(parsed);
  if(!d) throw new Error("shape");
  const n = d.stores.reduce((t,s)=> t + s.counts.length, 0);
  const o = d.stores.reduce((t,s)=> t + s.orders.length, 0);
  if(!confirm(`Replace what's on this device with this backup?\n\n${d.stores.length} store(s), ${n} counts, ${o} orders.`)) return null;
  S = d;
  if(!S.colorants.length) S.colorants = freshState().colorants;
  S.tab = "settings";
  save(); render();
  return { stores:d.stores.length, counts:n, orders:o };
}

function downloadBackup(){
  const blob = new Blob([JSON.stringify({ tintuition:1, exported:today(), data:S }, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `tintuition-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  const n = S.stores.reduce((t,s)=>t+s.counts.length,0);
  msg("ok", `Saved a backup with ${S.stores.length} store(s) and ${n} counts.`);
}

function restoreFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const r = applyBackup(JSON.parse(rd.result));
      if(r) msg("ok", `Restored ${r.stores} store(s), ${r.counts} counts, ${r.orders} orders.`);
    }catch(e){
      msg("bad", "That file isn't a Tintuition backup.");
    }
  };
  rd.onerror = () => msg("bad", "Couldn't read that file.");
  rd.readAsText(f);
  input.value = "";
}

function msg(kind, text){
  const el = document.getElementById("backupmsg");
  if(!el) { alert(text); return; }
  el.innerHTML = `<div class="banner ${kind}" style="margin:10px 0 0">${esc(text)}</div>`;
}

const TABS = [
  { id:"dashboard", label:"Stock",   ic:"▦" },

function render(){
  const st = store();
  document.getElementById("storelabel").textContent = st ? `Store #${st.number}` : "Add a store to begin";
  const main = document.getElementById("main");
  const nav = document.getElementById("nav");

  if(!st){
    main.innerHTML = `
      <div class="card pad">
        <h2 style="font-size:16px">Welcome to Tintuition</h2>
        <div class="helptext" style="margin-top:8px">${EXPLAINER_HTML}</div>

      <div class="card pad">
        <h2>Get started</h2>
        <div class="note">Two ways to begin:</div>
        <div style="margin-top:10px">
          <b style="font-size:14px">1. Add your store</b>
          <div class="note" style="margin-top:2px">Tap the dark bar at the top and enter your 4-digit store number.</div>
        </div>
        <div style="margin-top:14px">
          <b style="font-size:14px">2. Or load a backup</b>
          <div class="note" style="margin-top:2px">If someone sent you a data file, restore it here.</div>
          <button class="btn ghost" style="margin-top:8px" onclick="document.getElementById('restorefile').click()">Restore from file</button>
          <input type="file" id="restorefile" accept=".json,application/json,text/plain" hidden onchange="restoreFile(this)">
          <div id="backupmsg"></div>
        </div>
      </div>`;
    nav.innerHTML = "";
    return;
  }

  if(S.tab === "count" || S.tab === "order") S.tab = "entry";   // old tabs merged
  if(S.tab === "dashboard")      main.innerHTML = window.__detail ? viewDetail(st) : viewDashboard(st);
  else if(S.tab === "entry")     main.innerHTML = viewEntry(st);
  else if(S.tab === "survey")    main.innerHTML = viewSurvey(st);
  else if(S.tab === "history")   main.innerHTML = viewHistory(st);
  else                           main.innerHTML = viewSettings(st);

  if(S.tab === "survey") surveyRefresh();

  // if a draft restored counts onto the entry screen, refresh each row's live math
  if(S.tab === "entry"){
    const dr = currentDraft(st);
    if(dr && (dr.cbox || dr.cjar)){
      const ids = new Set([...Object.keys(dr.cbox||{}), ...Object.keys(dr.cjar||{})]);
      for(const cid of ids) countChanged(cid);
    }
  }

  nav.innerHTML = TABS.map(t =>
    `<button class="${S.tab===t.id?"on":""}" onclick="setTab('${t.id}')">
      <span class="ic">${t.ic}</span>${t.label}
    </button>`).join("");
}

/* ---------- go ---------- */
S = load();
if(S.stores.length && !S.stores.some(s=>s.id===S.currentId)) S.currentId = S.stores[0].id;
loadEntryDraft();
render();
</script>
</body>
